name: Build and Release Docker Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'  # triggers if you push tags that start with "v"


jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1. Checkout your repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2. Set up Docker Buildx (for multi-arch builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3. Log in to GHCR (GitHub Container Registry)
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_ACCESS_TOKEN }}

      # Step 4. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      # Step 5. Build and push multi-arch images to both registries
      - name: Build and push Docker images
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          # Use multiple tags (for version and "latest")
          tags: |
            ghcr.io/your-username/lwgparser-app:${{ github.ref_name }}
            ghcr.io/your-username/lwgparser-app:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lwgparser-app:${{ github.ref_name }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lwgparser-app:latest
          platforms: linux/amd64,linux/arm64

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')  # Only run when pushing a tag.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get Tag Annotation
        id: tag_annotation
        run: |
        # Remove the "refs/tags/" prefix to get the tag name.
          TAG_NAME=${GITHUB_REF#refs/tags/}
        # Extract the annotation content of that tag.
          ANNOTATION=$(git for-each-ref --format='%(contents)' refs/tags/$TAG_NAME)
          echo "annotation=$ANNOTATION" >> $GITHUB_OUTPUT

      # Use an action to create a release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.tag_annotation.outputs.annotation }}
        env:
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
